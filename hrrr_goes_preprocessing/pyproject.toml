[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "forecastprep"
version = "0.4.0"
description = "HRRR, station, and GOES preprocessing with PyTorch and budgeted acquisition"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=16", "scipy>=1.12", "xarray>=2024.6", "h5netcdf>=1.3", "h5py>=3.11", "pyproj>=3.6", "requests>=2.32", "PyYAML>=6", "s3fs>=2024.6", "herbie-data>=2024.8", "torch>=2.5", "scikit-learn>=1.5,<1.6", "matplotlib>=3.8", "Pillow>=10", "filelock>=3.13", "joblib>=1.4"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
forecastprep = "forecastprep.cli:main"
[tool.setuptools.packages.find]
include = ["forecastprep*"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
forecastprep = ["defaults.yaml"]
